name: Release

# Pushing a version tag (npm run deploy:prod makes it, then: git push origin main --tags) publishes a GitHub release
# with dist/tomte.js (what HACS downloads) and dist/loader.js (for manual installs), and the changelog section as notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION" || (echo "Tag $TAG does not match package.json version $VERSION" && exit 1)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: checks
        run: |
          npm run i18n:check
          npm run build
          git diff --exit-code -- dist/tomte.js dist/loader.js || (echo "dist/ is not up to date for this tag: run npm run build and commit it" && exit 1)
          npm run build:dev
          npm run smoke
      - name: release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" 'BEGIN{p=0} /^## /{ if (index($0, "## " v " ")==1 || $0=="## " v) {p=1; next} else if (p) {exit} } p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          cat release-notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tomte.js dist/loader.js --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/tomte.js dist/loader.js --title "Tomte $VERSION" --notes-file release-notes.md --verify-tag
          fi
