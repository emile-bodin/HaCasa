name: Release

# Publishes a GitHub release with dist/tomte.js and dist/loader.js (what you download and copy to /config/www/tomte/) and the
# changelog section of the version as notes. It runs
#   - on every push to main: if package.json's version has no release yet, it creates the tag and the release on GitHub
#     (so pushing the "Release x.y.z" commit is enough, no tag has to be pushed from your computer);
#   - on a pushed version tag (v*), which (re)publishes that release;
#   - by hand (Actions → Release → Run workflow), optionally for an existing tag, e.g. v1.1.0.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (default: v<version in package.json>), e.g. v1.1.0"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: which release
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            test "$TAG" = "v$VERSION" || (echo "Tag $TAG does not match package.json version $VERSION" && exit 1)
          else
            TAG="${{ github.event.inputs.tag || '' }}"
            TAG="${TAG:-v$VERSION}"
          fi
          SKIP=false
          # a plain push to main only creates a release that does not exist yet
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "branch" ] && gh release view "$TAG" >/dev/null 2>&1; then SKIP=true; fi
          { echo "TAG=$TAG"; echo "VERSION=$VERSION"; echo "SKIP=$SKIP"; } >> "$GITHUB_ENV"
          echo "release $TAG (skip: $SKIP)"
      - if: env.SKIP != 'true'
        run: npm ci
      - name: checks
        if: env.SKIP != 'true'
        run: |
          npm run i18n:check
          npm run build
          git diff --exit-code -- dist/tomte.js dist/loader.js || (echo "dist/ is not up to date for this commit: run npm run build and commit it" && exit 1)
          npm run build:dev
          npm run smoke
      - name: release notes from CHANGELOG.md
        if: env.SKIP != 'true'
        run: |
          awk -v v="$VERSION" 'BEGIN{p=0} /^## /{ if (index($0, "## " v " ")==1 || $0=="## " v) {p=1; next} else if (p) {exit} } p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
          cat release-notes.md
      - name: publish
        if: env.SKIP != 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/tomte.js dist/loader.js --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            gh release create "$TAG" dist/tomte.js dist/loader.js --title "Tomte $VERSION" --notes-file release-notes.md --verify-tag
          else
            gh release create "$TAG" dist/tomte.js dist/loader.js --title "Tomte $VERSION" --notes-file release-notes.md --target "${{ github.sha }}"
          fi
